<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Outer subtle tech ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#6366f1" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="16 12" />

  <!-- Shield Base -->
  <g filter="url(#glow)">
    <path d="M 256,76 L 388,136 C 388,272 332,368 256,428 C 180,368 124,272 124,136 Z" 
          fill="url(#shieldGrad)" />
    <!-- Shield Border Accent -->
    <path d="M 256,76 L 388,136 C 388,272 332,368 256,428 C 180,368 124,272 124,136 Z" 
          fill="none" stroke="#a5b4fc" stroke-width="5" stroke-opacity="0.6" />
  </g>

  <!-- Inner Education & Sync Motif -->
  <!-- Stylized Academic Cap -->
  <path d="M 256,150 L 336,190 L 256,230 L 176,190 Z" fill="url(#goldGrad)" />
  <path d="M 216,212 L 216,248 C 216,268 296,268 296,248 L 296,212" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
  <!-- Tassel -->
  <path d="M 336,190 L 348,226 C 348,236 342,246 338,252" fill="none" stroke="#fef08a" stroke-width="4" stroke-linecap="round" />
  <circle cx="338" cy="254" r="5" fill="#fef08a" />

  <!-- Synchronize Nodes (Arcs) -->
  <path d="M 190,296 A 80 80 0 0 1 322,296" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  <polygon points="328,296 312,284 316,306" fill="#ffffff" />

  <path d="M 322,340 A 80 80 0 0 1 190,340" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  <polygon points="184,340 200,352 196,330" fill="#ffffff" />

  <!-- Center Text CIS -->
  <text x="256" y="330" text-anchor="middle" font-family="'Inter', 'Arial', sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="4">CIS</text>

  <!-- Star of Excellence at base -->
  <polygon points="256,380 262,394 276,394 265,404 269,418 256,410 243,418 247,404 236,394 250,394" fill="url(#goldGrad)" />
</svg>